<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login | SahakarSaathi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-body">
  <main class="admin-login">
    <h1>SahakarSaathi admin</h1>
    <p class="admin-sub">Sign in to manage the knowledge base.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<p class="admin-flash">{{ messages[0] }}</p>{% endif %}
    {% endwith %}
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="admin-back"><a href="{{ url_for('home') }}">&larr; Back to the website</a></p>
  </main>
</body>
</html>
